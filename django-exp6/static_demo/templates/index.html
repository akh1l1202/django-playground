{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Django Website</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <!-- Simple Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Django Static Demo</a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <!-- Page Header (same background as surrounding) -->
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Welcome to My Website</h2>
                    <p class="text-muted">A simple Django page with CSS, Bootstrap, Images, and JavaScript</p>
                </div>

                <!-- Main Card -->
                <div class="card profile-card p-4 text-center">
                    <h4 class="mb-3">Meet the Cat</h4>
                    <p class="text-muted">Images loaded from the static folder:</p>

                    <!-- Static Image -->
                    <div class="my-2">
                        <img id="displayImage" src="{% if image_files %}{% static 'images/' %}{{ image_files.0 }}{% else %}{% static 'images/cat1.png' %}{% endif %}" alt="Cat Photo" class="img-fluid rounded cat-image">
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button class="btn btn-outline-primary px-3" onclick="changeImage()">Change Image</button>
                        <button class="btn btn-primary px-3" onclick="changeMessage()">Click Me</button>
                    </div>

                    <!-- Interactive JavaScript Test Text -->
                    <div class="mt-4 pt-2 border-top">
                        <p id="message" class="fw-semibold text-secondary mb-0">Click the button to test JavaScript:</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Pass dynamically detected images from static/images/ to JS -->
    <script>
        const imageList = [
            {% for img in image_files %}
                "{% static 'images/' %}{{ img }}",
            {% empty %}
                "{% static 'images/cat1.png' %}",
            {% endfor %}
        ];
    </script>

    <!-- Custom JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
